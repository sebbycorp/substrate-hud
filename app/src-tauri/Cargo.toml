[package]
name = "substrate-hud"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required by `app.macOSPrivateApi` for the transparent
# overlay window (same trade-off as stream-whiteboard: no Mac App Store).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
