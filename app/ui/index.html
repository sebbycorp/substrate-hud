<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Substrate HUD</title>
<style>
  :root {
    --white: #ffffff;
    --dim: rgba(255, 255, 255, 0.82);
    --faint: rgba(255, 255, 255, 0.45);
    --blue: #3d9bff;
    --green: #2ee59d;
    --red: #ff4d5e;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    color: var(--white);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  /* Legibility over busy scenes without a visible box. */
  .stage { text-shadow: 0 1px 3px rgba(0, 0, 0, .7), 0 0 1px rgba(0, 0, 0, .6); }

  /* Compact 720×284 stage; fit() scales it to the window / OBS source. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 720px; height: 284px;
    transform-origin: 0 0;
  }
  /* kagent logo band above everything; #content keeps the old W×H coordinates */
  #content { position: absolute; left: 0; }
  #logo { position: absolute; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .8)); }
  body.app #logo { margin-left: 60px; }   /* clear the window's traffic lights */
  #coLogo { display: none; }
  body.callouts #coLogo { display: block; position: fixed; left: 4vw; top: 4vh; height: min(9vh, 5vw); opacity: 0;
                          transition: opacity .4s; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .9)); }
  body.callouts.co-active #coLogo { opacity: 1; }
  #backdrop {
    position: absolute; inset: 4px; border-radius: 14px;
    background: rgba(8, 12, 20, .74);
    border: 1px solid rgba(255, 255, 255, .06);
    opacity: 0; transition: opacity .3s;
  }
  body.backdrop #backdrop { opacity: 1; }

  /* ── header ─────────────────────────────────────────── */
  header { position: absolute; left: 24px; right: 24px; top: 14px; height: 14px;
           display: flex; align-items: center; gap: 10px; }
  .brand { font: 800 10px/1 var(--sans); letter-spacing: .22em; }
  .ctx { font: 600 9.5px/1 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 6px;
          font: 800 8.5px/1 var(--sans); letter-spacing: .18em; color: var(--dim); }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--green);
            box-shadow: 0 0 8px var(--green); animation: breathe 2.4s ease-in-out infinite; }
  .live.down i { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }
  .live.sim i { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  @keyframes breathe { 50% { opacity: .35; } }

  /* ── stats ──────────────────────────────────────────── */
  #stats { position: absolute; left: 24px; right: 24px; top: 36px;
           display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .stat .k { font: 800 7.5px/1 var(--sans); letter-spacing: .2em; color: var(--dim); }
  .stat .v { margin-top: 5px; font: 700 23px/1 var(--sans); font-variant-numeric: tabular-nums;
             letter-spacing: -.02em; transition: color .4s; }
  .stat .v small { font-size: 10px; font-weight: 600; color: var(--dim); margin-left: 2px; letter-spacing: 0; }
  .stat .v.green { color: var(--green); }
  .stat .v.blue { color: var(--blue); }
  .stat .v.red { color: var(--red); }

  /* ── bands ──────────────────────────────────────────── */
  .band-label { position: absolute; left: 24px; font: 800 7.5px/1 var(--sans);
                letter-spacing: .2em; color: var(--dim); }
  .band-label b { color: var(--white); font-weight: 800; margin-left: 6px; letter-spacing: .05em; }
  #lblPool { top: 84px; }
  #lblStore { top: 182px; }
  .rule { position: absolute; left: 24px; right: 24px; height: 1.5px; background: var(--faint); }
  #ruleStore { top: 194px; }

  .bay {
    position: absolute; top: 98px; height: 72px;
    border: 2px solid var(--faint); border-radius: 9px;
    transition: left .7s var(--ease), top .7s var(--ease), width .7s var(--ease), height .7s var(--ease),
                border-color .5s, opacity .6s, box-shadow .5s;
    opacity: 0;
  }
  .bay.short .who { display: none; }
  .bay.high { border-color: rgba(255, 255, 255, .85); }
  .ptag { position: absolute; font: 700 7.5px/1 var(--mono); color: var(--dim); white-space: nowrap; }
  .ptag b { font: 800 7.5px/1 var(--sans); letter-spacing: .18em; margin-left: 7px; color: var(--blue); }
  .ptag.t-high b { color: var(--red); }
  .ptag.t-coding b { color: var(--white); }
  .ptag::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 2px;
                  margin-right: 7px; vertical-align: 0; background: var(--blue); }
  .ptag.t-high::before { background: var(--red); }
  .ptag.t-coding::before { background: var(--white); }
  .ptag span { margin-left: 7px; color: var(--dim); }
  .bay.in { opacity: 1; }
  .bay.busy { border-color: rgba(46, 229, 157, .75); box-shadow: 0 0 16px rgba(46, 229, 157, .12) inset; }
  .bay.warm { border-style: dashed; }
  .bay.pulse { animation: pulse .9s var(--ease); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 229, 157, .55); } 100% { box-shadow: 0 0 0 10px rgba(46, 229, 157, 0); } }
  .bay .name { position: absolute; left: 9px; top: 8px; max-width: 45%; font: 700 10px/1 var(--mono);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bay .meta { position: absolute; right: 9px; top: 8px; display: flex; gap: 8px;
               font: 800 7.5px/9px var(--sans); letter-spacing: .14em; color: var(--dim); }
  .bay .meta .st { color: var(--blue); }
  .bay.busy .meta .st { color: var(--green); }
  .bay.warm .meta .st { color: var(--white); }
  .bay .who { position: absolute; left: 9px; right: 9px; bottom: 7px; font: 700 9.5px/1 var(--sans);
              color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Agents are the kagent mark, tinted by state via currentColor. */
  .dot {
    position: absolute; left: 0; top: 0; width: 13px; height: 9.75px;
    color: var(--blue); opacity: 1;
    transition: transform 1s var(--ease), color .5s, opacity .5s, width .5s, height .5s, filter .5s;
  }
  .dot svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .dot.running { color: var(--green); opacity: 1; width: 28px; height: 21px;
                 filter: drop-shadow(0 0 6px rgba(46, 229, 157, .65)); }
  .dot.resuming, .dot.suspending { color: var(--white); opacity: 1; width: 18px; height: 13.5px;
                                   filter: drop-shadow(0 0 5px rgba(255, 255, 255, .55)); }
  .dot.waiting { color: var(--red); filter: drop-shadow(0 0 6px rgba(255, 77, 94, .7)); }
  .dot.gone { opacity: 0; }

  #legend { position: absolute; left: 24px; right: 290px; top: 256px; display: flex; gap: 14px;
            font: 700 8.5px/1 var(--sans); color: var(--dim); letter-spacing: .04em; white-space: nowrap; overflow: hidden; }
  #legend b { color: var(--white); font-weight: 800; margin-right: 4px; font-variant-numeric: tabular-nums; }

  /* ── event ticker (right of the store; the store wraps short of it) ── */
  #ticker { position: absolute; right: 24px; top: 202px; width: 260px; display: flex;
            flex-direction: column-reverse; gap: 3px; pointer-events: none; }
  .ev { font: 600 8.5px/1.35 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; text-align: right; animation: evIn .5s var(--ease); }
  .ev .a { color: var(--white); font-weight: 800; }
  .ev.restore .tag { color: var(--green); }
  .ev.suspend .tag, .ev.create .tag { color: var(--blue); }
  .ev.error .tag, .ev.error .a { color: var(--red); }
  .ev.info .tag { color: var(--white); }
  @keyframes evIn { from { opacity: 0; transform: translateY(6px); } }

  #error { position: absolute; left: 24px; right: 24px; top: 270px; font: 700 8px/1.2 var(--mono);
           color: var(--red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── portrait: a side rail (default) ─────────────────── */
  body.portrait header { flex-wrap: wrap; height: auto; top: 30px; left: 18px; right: 18px; row-gap: 7px; }
  body.portrait.app header { left: 18px; }
  body.portrait .ctx { order: 3; flex-basis: 100%; }
  body.portrait #stats { left: 18px; right: 18px; top: 76px; grid-template-columns: repeat(3, 1fr); row-gap: 14px; }
  body.portrait .band-label, body.portrait .rule { left: 18px; }
  body.portrait .rule { right: 18px; }
  body.portrait #lblPool { top: 172px; }
  /* store/legend/ticker tops are set in JS: sections stack to fit the pools */
  body.portrait .bay .who { right: 45%; }
  body.portrait #legend { left: 18px; right: 18px; flex-wrap: wrap; row-gap: 7px; }
  body.portrait #ticker { left: 18px; right: 18px; width: auto; flex-direction: column-reverse; gap: 4px; }
  body.portrait .ev { text-align: left; }
  body.portrait #error { left: 18px; right: 18px; top: auto; bottom: 14px; white-space: normal; }
  .ev .n { color: var(--red); font-weight: 800; margin-left: 4px; }

  /* ── callouts view (?view=callouts): big lower-third pop-ups for OBS ── */
  #callouts { display: none; }
  body.callouts #stage, body.callouts #bar, body.callouts #drag { display: none; }
  body.callouts #callouts { display: flex; position: fixed; inset: 0; flex-direction: column; justify-content: flex-end;
                            align-items: flex-start; gap: 1.2vh; padding: 4vh 4vw; pointer-events: none; }
  .co { font-family: -apple-system, "SF Pro Display", sans-serif; color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, .9), 0 0 3px rgba(0, 0, 0, .9), 0 0 18px rgba(0, 0, 0, .5);
        animation: coIn .45s cubic-bezier(.2, .8, .2, 1) both; }
  .co.out { animation: coOut .6s ease both; }
  .co .t { font-weight: 900; font-size: min(9vh, 5.2vw); letter-spacing: .01em; line-height: 1.05; }
  .co .t i { font-style: normal; margin-right: .3em; }
  .co .s { font-weight: 800; font-size: min(6vh, 3.2vw); opacity: .95; margin-top: .15em; }
  .co.restore .t i { color: #34f0a4; } .co.suspend .t i { color: #4aa3ff; } .co.error .t i, .co.error .s { color: #ff4f61; }
  @keyframes coIn { from { opacity: 0; transform: translateY(30%); } }
  @keyframes coOut { to { opacity: 0; transform: translateY(-20%); } }

  /* ── invaders: everything is drawn on one canvas ── */
  #arcade { position: absolute; left: 0; top: 0; display: none; }
  body.invaders #arcade { display: block; }
  body.invaders #content > :not(#arcade) { display: none; }   /* the logo band stays */

  /* ── pool usage graphs (rings) ── */
  body:not(.rings) #charts { display: none; }
  #charts .chart { position: absolute; overflow: visible; }
  #charts .base { stroke: rgba(255, 255, 255, .35); stroke-width: 1; }
  #charts .line { fill: none; stroke: var(--blue); stroke-width: 2.2; stroke-linejoin: round;
                  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .8)); }
  #charts .area { fill: var(--blue); opacity: .2; }
  #charts .t-high .line { stroke: var(--red); }   #charts .t-high .area { fill: var(--red); }
  #charts .t-coding .line { stroke: var(--white); } #charts .t-coding .area { fill: var(--white); }
  #charts .caxis { position: absolute; font: 800 7.5px/1 var(--sans); color: var(--dim); }

  /* ── timeline theme: a lane per worker over the last 5 min ── */
  body:not(.timeline) #timeline { display: none; }
  body.timeline .bay { display: none; }
  #timeline .lbl { position: absolute; font: 800 9px/22px var(--mono); color: var(--dim); }
  #timeline .track { position: absolute; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .5);
                     box-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
  #timeline .blk { position: absolute; height: 14px; border-radius: 4px; padding: 0 4px; overflow: hidden;
                   white-space: nowrap; background: rgba(255, 255, 255, .9); color: #0b0f17; text-shadow: none;
                   font: 800 8px/14px var(--sans); box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .6); }
  #timeline .blk.live { background: var(--green); box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 0 10px rgba(52, 240, 164, .6); }
  #timeline .axis { position: absolute; font: 800 8px/1 var(--sans); color: var(--dim); }
  body.timeline .dot.running { color: var(--green); width: 22px; height: 16.5px; }

  /* ── bars theme: one segmented bar per pool ───────── */
  body.bars .bay { border-radius: 5px; border: 2px solid rgba(255, 255, 255, .88); background: rgba(0, 0, 0, .28);
                   box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .5); }
  body.bars .bay.busy { border-color: var(--green); background: rgba(52, 240, 164, .9);
                        box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 0 14px rgba(52, 240, 164, .55); }
  body.bars .bay.warm { border-style: dashed; }
  body.bars .bay .name, body.bars .bay .meta, body.bars .bay .ring-n { display: none; }
  body.bars .bay .who { display: none; top: calc(100% + 5px); bottom: auto; left: 0; right: auto; width: calc(100% + 30px);
                        font: 800 9px/1.1 var(--sans); color: var(--green); }
  body.bars .bay.busy .who { display: block; }
  body.bars .ptag, body.timeline .ptag { display: flex; align-items: center; }
  body.bars .ptag .busy, body.timeline .ptag .busy { margin-left: auto; color: var(--white); font: 800 9px/1 var(--sans); letter-spacing: .06em; }
  body.bars .ptag .busy.full, body.timeline .ptag .busy.full { color: var(--red); }
  body.bars .dot.running { color: #062b1c; filter: none; width: 22px; height: 16.5px; }
  body.bars .dot.running svg { filter: none; }

  /* ── rings theme: workers are circles, no boxes ─────── */
  body.bold { --dim: rgba(255, 255, 255, .86); --blue: #4aa3ff; --green: #34f0a4; --red: #ff4f61; }
  body.bold .stage { text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 2px rgba(0, 0, 0, .9), 0 0 8px rgba(0, 0, 0, .45); }
  body.bold .stat .v { font-weight: 800; }
  body.bold .stat .k, body.bold .band-label, body.bold .ptag b { font-weight: 800; }
  body.bold .ptag { font-size: 10px; font-weight: 800; color: var(--white); }
  body.bold .ptag b { font-size: 9px; }
  body.bold .ptag::before { border-radius: 50%; width: 7px; height: 7px; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .5); }
  body.bold .rule { height: 2px; background: rgba(255, 255, 255, .7); box-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
  body.rings .bay {
    border-radius: 50%; border: 3px solid rgba(255, 255, 255, .9);
    background: rgba(0, 0, 0, .22);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .35);
  }
  body.rings .bay.busy { border-color: var(--green); background: rgba(52, 240, 164, .16);
                         box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 0 16px rgba(52, 240, 164, .6); }
  body.rings .bay.high:not(.busy) { border-width: 3.5px; }
  body.rings .bay .meta { display: none; }
  /* name under the ring; swapped for the running agent's name */
  body.rings .bay .name, body.rings .bay .who {
    top: calc(100% + 5px); bottom: auto; left: 50%; right: auto; transform: translateX(-50%);
    width: calc(100% + 26px); max-width: none; text-align: center; font: 800 9px/1.15 var(--sans);
    white-space: normal; overflow-wrap: anywhere; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  body.rings .bay .who { display: none; color: var(--green); }
  body.rings .bay.busy .who { display: -webkit-box; }
  body.rings .bay .name { display: none; }   /* worker names off; the agent name shows while busy */
  body.rings .bay .ring-n { position: absolute; top: -5px; right: -6px; min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 8px; background: var(--white); color: #0b0f17; font: 800 9px/15px var(--sans);
    text-align: center; text-shadow: none; box-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  body:not(.rings) .bay .ring-n { display: none; }
  body:not(.bars):not(.timeline) .ptag .busy { display: none; }
  body.bold .dot svg { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .8)); }
  body.rings .dot.running { filter: drop-shadow(0 0 6px rgba(52, 240, 164, .7)); }
  body.bold .ev .a, body.bold #legend b { font-weight: 800; }
  body.bold .ev, body.bold #legend { color: rgba(255, 255, 255, .9); font-weight: 700; }

  /* ── whiteboard theme: marker on a board ───────────── */
  /* Default: white marker straight on the (transparent) OBS scene.
     .board puts it on an off-white board with dark marker instead. */
  body.wb {
    --sans: "Marker Felt", "Chalkboard SE", "Noteworthy", sans-serif;
    --mono: "Chalkboard SE", "Noteworthy", "Marker Felt", sans-serif;
    --stroke: rgba(255, 255, 255, .62);
  }
  body.wb .stage { text-shadow: 0 1px 3px rgba(0, 0, 0, .8), 0 0 2px rgba(0, 0, 0, .7); }
  body.wb .bay::before, body.wb .rule, body.wb .dot svg { filter: url(#rough) drop-shadow(0 1px 2px rgba(0, 0, 0, .55)); }
  body.wb.board {
    --white: #1d2633; --dim: #5d6878; --faint: #b9c0ca;
    --blue: #1f6fd1; --green: #11935a; --red: #d92b3a; --stroke: #8c96a3;
  }
  body.wb.board .stage { text-shadow: none; }
  body.wb.board #backdrop { opacity: 1; background: #fbfbf8; border: 1.5px solid #cfd4db; border-radius: 16px;
                      box-shadow: inset 0 0 0 5px #eceef1, inset 0 0 0 6.5px #d7dbe1, 0 8px 28px rgba(0, 0, 0, .28); }
  body.wb .brand { font-weight: 400; font-size: 14px; letter-spacing: .05em; }
  body.wb .ctx { font-size: 10px; font-weight: 400; }
  body.wb .stat .k, body.wb .band-label, body.wb .live { font-weight: 400; font-size: 9px; letter-spacing: .08em; }
  body.wb .band-label b { font-weight: 400; letter-spacing: .02em; }
  body.wb .stat .v { font-weight: 400; font-size: 24px; letter-spacing: 0; }
  body.wb .stat .v small { font-weight: 400; }
  body.wb .rule { height: 2px; background: var(--white); opacity: .6; filter: url(#rough); }
  body.wb.board .rule, body.wb.board .bay::before { filter: url(#rough); }
  /* boxes: border drawn on a pseudo-element so only the line wobbles, not the text */
  body.wb .bay, body.wb .bay.busy { border-color: transparent; box-shadow: none; }
  body.wb .bay::before { content: ''; position: absolute; inset: -1px; border: 2.2px solid var(--stroke);
                         border-radius: 10px; filter: url(#rough); transition: border-color .5s, background .5s; }
  body.wb .bay.high::before { border-color: var(--white); }
  body.wb .bay.busy::before { border-color: var(--green); background: rgba(46, 229, 157, .1); }
  body.wb.board .bay.busy::before { background: rgba(17, 147, 90, .09); }
  body.wb .bay.warm::before { border-style: dashed; }
  body.wb .bay .name { font-weight: 400; font-size: 11px; }
  body.wb .bay .meta, body.wb .ptag b { font-weight: 400; letter-spacing: .08em; font-size: 8.5px; }
  body.wb .bay .who { font-weight: 400; font-size: 10.5px; }
  body.wb .ptag { font-size: 9px; font-weight: 400; }
  body.wb .ptag::before { border-radius: 50%; filter: url(#roughS); }
  body.wb .dot, body.wb .dot.running, body.wb .dot.resuming, body.wb .dot.suspending, body.wb .dot.waiting { filter: none; }
  body.wb .dot svg { filter: url(#roughS) drop-shadow(0 1px 1.5px rgba(0, 0, 0, .6)); }
  body.wb .dot.running svg { filter: url(#rough) drop-shadow(0 0 5px rgba(46, 229, 157, .6)); }
  body.wb.board .dot svg { filter: url(#roughS); }
  body.wb.board .dot.running svg { filter: url(#rough); }
  body.wb #legend, body.wb #legend b { font-weight: 400; font-size: 9.5px; }
  body.wb .ev { font-size: 9px; font-weight: 400; }
  body.wb .ev .a, body.wb .ev .n { font-weight: 700; }
  body.wb .live i { box-shadow: none; }

  /* ── app-window toolbar (never shown in OBS Browser Source) ───────── */
  #bar { position: fixed; top: 10px; right: 12px; left: 80px; display: none; flex-wrap: wrap;
         justify-content: flex-end; gap: 6px; opacity: 0;
         transition: opacity .2s; z-index: 10; }
  body.app #bar { display: flex; }
  body.app:hover #bar { opacity: 1; }
  body.clickthru #bar { display: none; }
  #bar button { font: 600 10px/1 var(--sans); letter-spacing: .12em; color: var(--white);
                background: rgba(20, 26, 36, .85); border: 1px solid rgba(255, 255, 255, .14);
                border-radius: 7px; padding: 7px 9px; cursor: pointer; }
  #bar button.on { border-color: var(--green); color: var(--green); }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
           font: 500 12px/1 var(--sans); background: rgba(20, 26, 36, .92); color: var(--white);
           padding: 9px 14px; border-radius: 8px; opacity: 0; transition: opacity .25s;
           pointer-events: none; z-index: 11; }
  #toast.show { opacity: 1; }
  #drag { position: fixed; left: 0; right: 0; top: 0; height: 40px; z-index: 5; }
</style>

<script>
const $ = id => document.getElementById(id);
const TAURI = window.__TAURI__;
const params = new URLSearchParams(location.search);
// Portrait is a side rail (default); wide is a lower-third strip.
const LAYOUTS = { portrait: { W: 320, H: 840, PAD: 18 }, wide: { W: 720, H: 284, PAD: 24 } };
let layout = 'portrait', W, H, PAD;

// ── fit the stage to any window / OBS source size ──────────────────────
// Height of the kagent logo band above the content, per layout.
let LH = 40;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / (H + LH));
  window.stageScale = s;
  $('stage').style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', fit);
// Space Invaders in wide mode gets a full 16:9 stage instead of the short strip.
const INVADERS_WIDE = { W: 1280, H: 658, PAD: 40 };   // + 62px logo band = 1280×720
function setLayout(name) {
  layout = name;
  ({ W, H, PAD } = name === 'wide' && theme === 'invaders' ? INVADERS_WIDE : LAYOUTS[name]);
  LH = name === 'portrait' ? 40 : theme === 'invaders' ? 62 : 32;
  document.body.classList.toggle('portrait', name === 'portrait');
  $('stage').style.width = W + 'px';
  $('stage').style.height = H + LH + 'px';
  Object.assign($('content').style, { top: LH + 'px', width: W + 'px', height: H + 'px' });
  const lh = Math.round(LH * (name === 'portrait' ? .62 : .64));      // logo height
  Object.assign($('logo').style, { left: PAD + 'px', top: Math.round(LH - lh - (name === 'portrait' ? 2 : 4)) + 'px', height: lh + 'px' });
  fit();
}

// ── prefs (app window only; OBS gets query params) ─────────────────────
const store = {
  get(k, d) { try { const v = localStorage.getItem('hud.' + k); return v == null ? d : v === '1'; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hud.' + k, v ? '1' : '0'); } catch {} },
};
if (TAURI) document.body.classList.add('app');
// B / ?board=1 (?panel=1): the whiteboard's board, or glass's dark panel. Off = transparent.
const bp = params.get('board') ?? params.get('panel');
let backdrop = bp != null ? bp !== '0' : (TAURI ? store.get('board', false) : false);
let sim = params.get('sim') === '1';
// whiteboard is the default look; ?theme=glass (or W in the app) for the transparent one
const THEMES = ['rings', 'invaders', 'timeline', 'bars', 'wb', 'glass'];
// The theme actually drawn: the timeline needs the tall rail, so wide falls back to bars.
const vt = () => (theme === 'timeline' && layout === 'wide' ? 'bars' : theme);
const savedTheme = (() => { try { return localStorage.getItem('hud.theme'); } catch { return null; } })();
let theme = THEMES.includes(params.get('theme')) ? params.get('theme') : (TAURI && THEMES.includes(savedTheme) ? savedTheme : 'rings');
setLayout(params.has('layout') ? (params.get('layout') === 'wide' ? 'wide' : 'portrait')
                               : (TAURI && store.get('wide', false) ? 'wide' : 'portrait'));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── rendering ──────────────────────────────────────────────────────────
// kagent mark on an 8×6 grid; evenodd keeps the face window see-through.
const AGENT_SVG = '<svg viewBox="0 0 8 6" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" ' +
  'd="M2 0H6L8 2V5H7V6H2L0 4V2H1V1H2Z M2 2V5H7V2Z M3 3H4V4H3Z M5 3H6V4H5Z"/></svg>';
const bayEls = new Map(), dotEls = new Map(), seenEvents = new Set();
let last = null;

function fmtMs(ms) {
  if (ms == null) return '–';
  return ms >= 1000 ? `${(ms / 1000).toFixed(1)}<small>s</small>` : `${ms}<small>ms</small>`;
}
function short(pod) { return pod.replace(/^.*-([a-z0-9]{5})$/, '$1'); }
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h`;
}

// A pool's tier: its substrate.viper-env/tier label, else "high" if it has a PriorityClass.
function tierOf(p) { return p.tier || (p.priority_class ? 'high' : 'low'); }
const TIER_LABEL = { high: 'HIGH PRIORITY', coding: 'CODING', low: 'LOW PRIORITY' };

// Workers grouped by pool: high, then coding, then everything else.
function groupWorkers(workers, pools) {
  const rank = p => ({ high: 0, coding: 1 })[tierOf(p)] ?? 2;
  const order = [...pools].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  const groups = order.map(pool => ({ pool, workers: workers.filter(w => w.pool === pool.name) }));
  const known = new Set(pools.map(p => p.name));
  const strays = workers.filter(w => !known.has(w.pool));
  if (strays.length) groups.push({ pool: { name: strays[0].pool || 'workers', priority_class: '' }, workers: strays });
  return groups.filter(g => g.workers.length || g.pool.desired);
}

// Returns bay rectangles keyed by worker name, plus one header per pool.
function layoutBays(workers, pools) {
  const groups = groupWorkers(workers, pools);
  const tiered = groups.length > 1 || groups.some(g => tierOf(g.pool) !== 'low');
  const n = Math.max(workers.length, 1), G = Math.max(groups.length, 1), pos = new Map(), tags = [];
  const tag = (g, x, y, w) => (tiered || vt() === 'bars' || vt() === 'timeline') && tags.push({ key: g.pool.name, x, y, w, pool: g.pool, tier: tierOf(g.pool), workers: g.workers });
  if (vt() === 'timeline') {
    // one lane per worker; time runs right to left, "now" at the right edge
    const LANE = 22, gap = 6, LABEL = 40, NOW = 28, lanes = [];
    let y = 190;
    for (const g of groups) {
      tag(g, PAD, y, W - PAD * 2); y += 18;
      for (const wk of g.workers) {
        lanes.push({ worker: wk, y, h: LANE, x0: PAD + LABEL, x1: W - PAD - NOW });
        pos.set(wk.name, { x: W - PAD - NOW + 4, y, w: NOW - 4, h: LANE });
        y += LANE + gap;
      }
      y += 10 - gap;
    }
    return { pos, tags, lanes, bottom: y + 10 };
  }
  if (vt() === 'bars') {
    // one bar per pool, one segment per worker
    const gap = 4, BAR = 24;
    const seg = (g, x0, width, y) => {
      const k = Math.max(g.workers.length, 1), w = (width - gap * (k - 1)) / k;
      g.workers.forEach((wk, i) => pos.set(wk.name, { x: x0 + i * (w + gap), y, w, h: BAR }));
    };
    if (layout === 'portrait') {
      let y = 190;
      for (const g of groups) {
        tag(g, PAD, y, W - PAD * 2); y += 17;
        seg(g, PAD, W - PAD * 2, y); y += BAR + 30;
      }
      return { pos, tags, bottom: y - 14 };
    }
    const GROUP = 18, gw = (W - PAD * 2 - GROUP * (G - 1)) / G;
    groups.forEach((g, i) => { const x = PAD + i * (gw + GROUP); tag(g, x, 86, gw); seg(g, x, gw, 102); });
    return { pos, tags, bottom: 170 };
  }
  if (vt() === 'rings') {
    // workers are rings: rows under each pool title (portrait), groups side by side (wide)
    const D = 44, gap = 32, GROUP = 26;
    if (layout === 'portrait') {
      const TAG = tiered ? 20 : 0, ROW = D + 30, CHART = 26, charts = [];
      const per = Math.max(1, Math.floor((W - 2 * PAD + gap) / (D + gap)));
      let y = 190;
      for (const g of groups) {
        tag(g, PAD, y); y += TAG;
        g.workers.forEach((wk, i) => pos.set(wk.name, { x: PAD + 4 + (i % per) * (D + gap), y: y + Math.floor(i / per) * ROW, w: D, h: D }));
        y += Math.max(1, Math.ceil(g.workers.length / per)) * ROW;
        // busy-workers-over-time line for this pool
        charts.push({ pool: g.pool, workers: g.workers, tier: tierOf(g.pool), x: PAD, y, w: W - PAD * 2, h: CHART });
        y += CHART + 16;
      }
      return { pos, tags, charts, bottom: y - 10 };
    }
    let x = PAD;
    for (const g of groups) {
      tag(g, x, 85);
      for (const wk of g.workers) { pos.set(wk.name, { x: x + 2, y: 102, w: D, h: D }); x += D + gap; }
      x += GROUP - gap;
    }
    return { pos, tags, bottom: 170 };
  }
  if (layout === 'portrait') {
    // stacked full-width bays; shrink only when there are many workers
    const gap = 8, TAG = tiered ? 18 : 0, GROUP = 12;
    const h = Math.max(40, Math.min(52, (330 - G * TAG - (n - G) * gap - (G - 1) * GROUP) / n));
    let y = 190;
    for (const g of groups) {
      tag(g, PAD, y); y += TAG;
      for (const wk of g.workers) { pos.set(wk.name, { x: PAD, y, w: W - PAD * 2, h }); y += h + gap; }
      y += GROUP - gap;
    }
    return { pos, tags, bottom: y - GROUP };
  }
  const gap = 10, GROUP = 22, avail = W - PAD * 2;
  const w = Math.min(200, (avail - (n - G) * gap - (G - 1) * GROUP) / n);
  const total = w * n + (n - G) * gap + (G - 1) * GROUP;
  let x = PAD + (avail - total) / 2;
  for (const g of groups) {
    tag(g, x, 85);
    for (const wk of g.workers) { pos.set(wk.name, { x, y: 98, w, h: 72 }); x += w + gap; }
    x += GROUP - gap;
  }
  return { pos, tags, bottom: 170 };
}

function render(s) {
  last = s;
  if (CALLOUTS) { callouts.feed(s); return; }
  if (vt() === 'invaders') { arcade.feed(s); return; }
  const now = s.now || Date.now();
  // header
  const pool = s.pools[0];
  const nss = [...new Set(s.pools.map(p => p.namespace))].join(', ');
  $('ctx').textContent = `${s.context}${s.pools.length === 1 ? ' · ' + pool.namespace + '/' + pool.name : nss ? ' · ' + nss : ''}`;
  const live = $('live');
  live.classList.toggle('down', !s.connected && !sim);
  live.classList.toggle('sim', sim);
  $('liveTxt').textContent = sim ? 'SIMULATED' : !s.connected ? 'OFFLINE' : s.log_stream ? 'LIVE' : 'POLLING';
  $('error').textContent = sim ? '' : (s.error || '');

  // stats
  const workers = s.workers;
  const ready = workers.filter(w => w.ready).length;
  const desired = s.pools.reduce((a, p) => a + p.desired, 0) || workers.length;
  const running = s.actors.filter(a => a.state === 'running').length;
  const moving = s.actors.filter(a => a.state === 'resuming' || a.state === 'suspending').length;
  $('sWorkers').innerHTML = `${ready}<small>/ ${desired}</small>`;
  $('sWorkers').className = 'v' + (ready < desired ? ' red' : '');
  $('sAgents').textContent = s.actors.length;
  $('sRunning').innerHTML = `${running}${moving ? `<small>+${moving}</small>` : ''}`;
  $('sDensity').innerHTML = ready ? `${Math.round(s.actors.length / ready)}<small>: 1</small>` : '–';
  $('sRestore').innerHTML = fmtMs(s.stats.p50_restore_ms);
  $('sResumes').innerHTML = `${s.stats.resumes}${s.stats.errors ? `<small style="color:var(--red)">${s.stats.errors} err</small>` : ''}`;
  $('poolName').textContent = s.pools.length > 1 ? `${s.pools.length} pools  ·  gVisor` : pool ? `${pool.name}  ·  gVisor` : '';

  // bays
  const { pos, tags, bottom, lanes, charts } = layoutBays(workers, s.pools);
  renderTimeline(lanes, s.sessions || [], now);
  renderCharts(charts, s.sessions || [], now);
  $('lblPool').style.visibility = layout === 'wide' && tags.length ? 'hidden' : '';
  const highPools = new Set(tags.filter(t => t.tier === 'high').map(t => t.key));
  const hosted = new Map();
  for (const a of s.actors) if (a.worker && (a.state === 'running' || a.state === 'resuming')) {
    if (!hosted.has(a.worker)) hosted.set(a.worker, []);
    hosted.get(a.worker).push(a);
  }
  $('pooltags').innerHTML = tags.map(t => {
    const busy = t.workers.filter(w => (hosted.get(w.name) || []).length).length, n = t.workers.length;
    return `<div class="ptag t-${esc(t.tier)}" style="left:${t.x}px;top:${t.y}px${t.w ? `;width:${t.w}px` : ''}">${esc(t.pool.name)}` +
      `<b>${TIER_LABEL[t.tier] || esc(t.tier.toUpperCase())}</b>` +
      (vt() === 'bars' || vt() === 'timeline' ? `<span class="busy${n && busy === n ? ' full' : ''}">${busy}/${n} BUSY</span>`
                        : `<span>${t.pool.ready ?? 0}/${t.pool.desired ?? 0}</span>`) + `</div>`;
  }).join('');
  const alive = new Set();
  for (const wk of workers) {
    alive.add(wk.name);
    let el = bayEls.get(wk.name);
    if (!el) {
      el = document.createElement('div');
      el.className = 'bay';
      el.innerHTML = '<div class="name"></div><div class="who"></div><div class="meta"><span class="st"></span><span class="ses"></span></div><div class="ring-n"></div>';
      $('bays').appendChild(el);
      bayEls.set(wk.name, el);
      el._sessions = wk.sessions;
      requestAnimationFrame(() => el.classList.add('in'));
    }
    const p = pos.get(wk.name);
    el.style.left = p.x + 'px'; el.style.width = p.w + 'px';
    el.style.top = p.y + 'px'; el.style.height = p.h + 'px';
    el.classList.toggle('short', p.h < 40);
    el.classList.toggle('high', highPools.has(wk.pool));
    const here = hosted.get(wk.name) || [];
    el.classList.toggle('busy', here.some(a => a.state === 'running'));
    el.classList.toggle('warm', !wk.ready);
    el.querySelector('.name').textContent = short(wk.name);
    el.querySelector('.who').textContent = here.map(a => `${a.agent || 'agent'} · ${ago(now - a.since)}`).join('   ');
    el.querySelector('.st').textContent = !wk.ready ? (wk.phase === 'Terminating' ? 'DRAINING' : 'WARMING') : here.length ? 'RUNNING' : 'IDLE';
    el.querySelector('.ses').textContent = wk.sessions ? `${wk.sessions} SESSION${wk.sessions > 1 ? 'S' : ''}` : '';
    const badge = el.querySelector('.ring-n');
    badge.textContent = wk.sessions || ''; badge.style.display = wk.sessions ? '' : 'none';
    if (wk.sessions > el._sessions) {
      el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
    }
    el._sessions = wk.sessions;
  }
  for (const [name, el] of bayEls) if (!alive.has(name)) {
    el.classList.remove('in'); bayEls.delete(name); setTimeout(() => el.remove(), 700);
  }

  // dots: storage grid for suspended, bay slots for hosted, queue for orphans
  const portrait = layout === 'portrait';
  const storeLbl = portrait ? bottom + 22 : 182;
  if (portrait) { $('lblStore').style.top = storeLbl + 'px'; $('ruleStore').style.top = storeLbl + 12 + 'px'; }
  else { $('lblStore').style.top = $('ruleStore').style.top = ''; }
  const STORE_Y = portrait ? storeLbl + 22 : 204, STEP = 17, ROW = 15, storeW = W - PAD * 2 - (portrait ? 0 : 276);
  const perRow = Math.floor(storeW / STEP);
  const suspended = s.actors.filter(a => a.state === 'suspended' || (a.state === 'suspending' && !a.worker));
  const slot = new Map();
  suspended.forEach((a, i) => slot.set(a.name, { x: PAD + (i % perRow) * STEP, y: STORE_Y + Math.floor(i / perRow) * ROW }));
  for (const [worker, list] of hosted) {
    const p = pos.get(worker); if (!p) continue;
    if (vt() === 'rings') {
      list.forEach((a, i) => slot.set(a.name, { x: p.x + (p.w - 28) / 2 + i * 6, y: p.y + (p.h - 21) / 2 - i * 4 }));
      continue;
    }
    if (vt() === 'bars' || vt() === 'timeline') {
      list.forEach((a, i) => slot.set(a.name, { x: p.x + 6 + i * 26, y: p.y + (p.h - 16.5) / 2 }));
      continue;
    }
    if (portrait) {
      // bottom-right of the bay (clear of the status line), filling leftwards
      list.forEach((a, i) => slot.set(a.name, { x: p.x + p.w - 37 - (i % 4) * 34, y: p.y + p.h - 27 }));
      continue;
    }
    const per = Math.max(1, Math.floor((p.w - 18) / 34));
    list.forEach((a, i) => slot.set(a.name, { x: p.x + 9 + (i % per) * 34, y: p.y + 24 + Math.floor(i / per) * 24 }));
  }
  let q = 0;
  for (const a of s.actors) if (!slot.has(a.name)) {
    // resuming/suspending with an unknown or departed worker: hold mid-air
    const p = a.worker && pos.get(a.worker);
    const midY = portrait ? bottom + 6 : 172;
    slot.set(a.name, p ? { x: p.x + p.w / 2 - 9, y: midY } : { x: W / 2 - 40 + (q++) * 22, y: midY });
  }
  const live2 = new Set();
  for (const a of s.actors) {
    live2.add(a.name);
    let d = dotEls.get(a.name);
    const p = slot.get(a.name);
    if (!d) {
      d = document.createElement('div');
      d.className = 'dot gone';
      d.innerHTML = AGENT_SVG;
      d.style.transform = `translate(${p.x}px, ${p.y + 30}px)`;
      $('dots').appendChild(d); dotEls.set(a.name, d);
      void d.offsetWidth;
    }
    const waiting = a.state === 'resuming' && !a.worker && now - a.since > 4000;
    d.className = `dot ${a.state}${waiting ? ' waiting' : ''}`;
    d.title = `${a.agent} · ${a.name}`;
    d.style.transform = `translate(${p.x}px, ${p.y}px)`;
  }
  for (const [name, d] of dotEls) if (!live2.has(name)) {
    d.classList.add('gone'); dotEls.delete(name); setTimeout(() => d.remove(), 600);
  }
  $('storeCount').textContent = `${s.actors.filter(a => a.state === 'suspended').length} checkpointed`;

  // legend: agents per template
  const by = new Map();
  for (const a of s.actors) by.set(a.agent || 'agent', (by.get(a.agent || 'agent') || 0) + 1);
  $('legend').innerHTML = [...by].sort((a, b) => b[1] - a[1]).slice(0, 8)
    .map(([k, v]) => `<span><b>${v}</b>${esc(k)}</span>`).join('');
  if (portrait) {
    const storeBottom = STORE_Y + Math.max(1, Math.ceil(suspended.length / perRow)) * ROW;
    const legendTop = storeBottom + 10;
    $('legend').style.top = legendTop + 'px';
    $('ticker').style.top = legendTop + $('legend').offsetHeight + 14 + 'px';
  } else { $('legend').style.top = $('ticker').style.top = ''; }

  // ticker: newest first, last 7
  const tk = $('ticker');
  const evs = s.events.slice(layout === 'portrait' ? -6 : -4);
  const want = new Set(evs.map(e => e.id));
  for (const el of [...tk.children]) if (!want.has(+el.dataset.id)) el.remove();
  for (const e of evs) {
    let el = tk.querySelector(`[data-id="${e.id}"]`);
    const sig = `${e.count || 1}|${e.ts}`;
    if (el && el.dataset.sig === sig) continue;
    if (!el) {
      el = document.createElement('div');
      el.className = `ev ${e.kind}`; el.dataset.id = e.id;
      tk.appendChild(el);
    }
    el.dataset.sig = sig;
    const t = new Date(e.ts).toLocaleTimeString([], { hour12: false });
    const tag = { restore: '▲', suspend: '▼', create: '＋', error: '✕', info: '•' }[e.kind] || '•';
    const text = e.kind === 'error' ? e.text.replace(/^Failed to reconcile actor template, requeueing: /, 'golden snapshot retrying: ')
                                    : e.text.replace(/→ (\S+)/, (_, pod) => '→ ' + short(pod));
    el.innerHTML = `${t}  <span class="tag">${tag}</span> <span class="a">${esc(e.agent)}</span> ${esc(text)}` +
                   (e.count > 1 ? `<span class="n">×${e.count}</span>` : '');
  }
}
// Pool usage graphs: a step line of busy workers over the last CHART_WIN, per pool.
const CHART_WIN = (Number(params.get('chart')) || 5) * 60_000;
function renderCharts(charts, sessions, now) {
  const el = $('charts');
  if (!charts) { el.innerHTML = ''; return; }
  const t0 = now - CHART_WIN, out = [];
  for (const c of charts) {
    const names = new Set(c.workers.map(w => w.name)), n = Math.max(c.workers.length, 1);
    const mine = sessions.filter(ss => names.has(ss.worker) && (ss.end ?? now) > t0);
    // +1 when a session starts, -1 when it ends; count what was already running at t0
    let level = mine.filter(ss => ss.start <= t0).length;
    const steps = [];
    for (const ss of mine) {
      if (ss.start > t0) steps.push([ss.start, 1]);
      if (ss.end != null) steps.push([ss.end, -1]);
    }
    steps.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const X = t => ((t - t0) / CHART_WIN) * c.w, Y = v => c.h - 2 - (Math.min(v, n) / n) * (c.h - 4);
    let d = `M0 ${Y(level)}`;
    for (const [t, dv] of steps) { level += dv; d += ` H${X(t).toFixed(1)} V${Y(level).toFixed(1)}`; }
    d += ` H${c.w}`;
    const area = `${d} V${c.h} H0 Z`;
    out.push(`<svg class="chart t-${esc(c.tier)}" style="left:${c.x}px;top:${c.y}px" width="${c.w}" height="${c.h}" viewBox="0 0 ${c.w} ${c.h}">` +
             `<line class="base" x1="0" y1="${c.h - 1}" x2="${c.w}" y2="${c.h - 1}"/>` +
             `<path class="area" d="${area}"/><path class="line" d="${d}"/></svg>` +
             `<div class="caxis" style="left:${c.x}px;top:${c.y + c.h + 2}px">−${CHART_WIN / 60000}m</div>` +
             `<div class="caxis" style="left:${c.x + c.w - 16}px;top:${c.y + c.h + 2}px">now</div>`);
  }
  el.innerHTML = out.join('');
}

// Activity timeline: each session is a block on its worker's lane over the last WINDOW.
const WINDOW = (Number(params.get('window')) || 2) * 60_000;
function renderTimeline(lanes, sessions, now) {
  const el = $('timeline');
  if (!lanes) { el.innerHTML = ''; return; }
  const t0 = now - WINDOW, out = [];
  for (const L of lanes) {
    const span = L.x1 - L.x0, X = t => L.x0 + Math.max(0, Math.min(1, (t - t0) / WINDOW)) * span;
    out.push(`<div class="lbl" style="left:${PAD}px;top:${L.y}px">${esc(short(L.worker.name))}</div>`,
             `<div class="track" style="left:${L.x0}px;top:${L.y + L.h / 2 - 1}px;width:${span}px"></div>`);
    for (const ss of sessions) {
      if (ss.worker !== L.worker.name) continue;
      const end = ss.end ?? now;
      if (end < t0) continue;
      const a = X(ss.start), b = ss.end == null ? L.x1 : X(end), w = Math.max(3, b - a);
      out.push(`<div class="blk${ss.end == null ? ' live' : ''}" style="left:${a}px;top:${L.y + (L.h - 14) / 2}px;width:${w}px"` +
               ` title="${esc(ss.agent)}">${w > 26 ? esc(ss.agent) : ''}</div>`);
    }
  }
  const last = lanes[lanes.length - 1];
  if (last) {
    const y = last.y + last.h + 4;
    out.push(`<div class="axis" style="left:${last.x0}px;top:${y}px">−${WINDOW / 60000}m</div>`,
             `<div class="axis" style="left:${(last.x0 + last.x1) / 2 - 10}px;top:${y}px">−${WINDOW / 120000}m</div>`,
             `<div class="axis" style="left:${last.x1 - 14}px;top:${y}px">now</div>`);
  }
  el.innerHTML = out.join('');
}

// ── arcade sound effects: synthesised with Web Audio, off unless enabled ──
// OBS Browser Sources play audio (tick "Control audio via OBS" to mix it).
const sfx = (() => {
  let ac = null;
  let on = params.has('sound') ? params.get('sound') !== '0' : (TAURI ? store.get('sound', false) : false);
  const ctx = () => {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  function tone(f0, f1, dur, type = 'square', vol = 0.05) {
    const a = ctx(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.12) {
    const a = ctx(), n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    src.buffer = buf; f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(140, t + dur);
    g.gain.value = vol; src.connect(f).connect(g).connect(a.destination); src.start(t);
  }
  // at most one of each sound per 90 ms, so a burst of events doesn't pile up voices
  const last = {};
  const safe = (name, fn) => (...a) => {
    const t = performance.now();
    if (!on || t - (last[name] || 0) < 90) return;
    last[name] = t;
    try { fn(...a); } catch {}
  };
  return {
    get on() { return on; },
    toggle() { on = !on; if (TAURI) store.set('sound', on); if (on) safe('ui', () => tone(660, 990, 0.12, 'square', 0.04))(); return on; },
    laser: safe('laser', () => tone(1500, 160, 0.17)),
    boom: safe('boom', () => noise(0.38)),
    beam: safe('beam', () => tone(200, 900, 0.32, 'triangle', 0.045)),
  };
})();

// ── callouts view: big pop-ups for restores, checkpoints and errors ──────
const callouts = (() => {
  let lastId = null;
  const el = () => $('callouts');
  function card(e) {
    const ms = (e.text.match(/(\d+)\s*ms/) || [])[1], pod = (e.text.match(/→ (\S+)/) || [])[1];
    const agent = (e.agent || 'agent').toUpperCase();
    const spec = {

      const x = k.x0 + (dx1 + mw - k.x0) * (u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
      const y = k.y0 + (dy1 + mh - k.y0) * (G.land ? (u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2) : u * u);
      if (u < 1) sprite(SPR.mark, x - mw, y - mh, G.markPx, tierInfo(k.tier).color, 1, true);
      else {
        const v = (t - k.at - (G.land ? 1100 : 900)) / 350;          // landing ping
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - v); ctx.strokeStyle = tierInfo(k.tier).color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(dx1 + mw, dy1 + mh, 6 + v * 10, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }
    }
    capsules = capsules.filter(k => t - k.at < (G.land ? 1450 : 1250));

    // event feed: under the store in landscape, at the bottom in portrait
    const nEv = G.land ? 5 : 3;
    const evY = G.land ? Math.max(cy2 + 34 * fs, H - 52 - (nEv - 1) * 15 * fs) : H - 56;
    if (G.land) text('EVENTS', G.sx0, evY - 18 * fs, 8, C.dim);
    (s.events || []).slice(-nEv).reverse().forEach((e, i) => {
      const c = { restore: C.green, suspend: C.blue, create: C.blue, error: C.red }[e.kind] || C.white;
      const tag = { restore: '▲', suspend: '▼', error: '✕' }[e.kind] || '•';
      const txt = `${tag} ${e.agent} ${e.text.replace(/→ (\S+)/, (_, pod) => '→ ' + short(pod))}`.toUpperCase();
      text(txt, G.sx0, evY + i * (G.land ? 15 * fs : 16), G.land ? 7 : 8.5, c, 'left', G.sx1 - G.sx0);
    });

    raf = requestAnimationFrame(frame);
  }

  return {
    init() { cv = $('arcade'); ctx = cv.getContext('2d'); },
    feed,
    start() { if (!raf && snap) raf = requestAnimationFrame(frame); },
    get stats() { return { fired, hits, waiting: doomed.length, invaders: occ.size }; },
  };
})();
arcade.init();

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

// ── data: Tauri events in the app, SSE in a browser / OBS source ───────
function onSnap(json) { if (!sim) { try { render(JSON.parse(json)); } catch (e) { console.warn(e); } } }
if (TAURI) {
  TAURI.event.listen('snapshot', ev => onSnap(ev.payload));
  TAURI.core.invoke('get_state').then(onSnap);
} else if (location.protocol.startsWith('http')) {
  const connect = () => {
    const es = new EventSource('/events');
    es.onmessage = ev => onSnap(ev.data);
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  };
  connect();
} else {
  sim = true; // opened as a file: nothing to talk to
}

// ── simulated substrate (S): for talks or a quiet cluster ──────────────
const simState = (() => {
  const agents = ['fortigate', 'k8s-assistant', 'sre-triage', 'billing-bot', 'docs-helper'];
  // one reserved high-tier worker, two shared low-tier workers
  const workers = [['kagent-high', 'kagent-high-7d9f6c5b8-hi0aq'], ['kagent-high', 'kagent-high-7d9f6c5b8-hi1aq'],
                   ['kagent-coding', 'kagent-coding-5b79cd685-cd0aq'], ['kagent-coding', 'kagent-coding-5b79cd685-cd1aq'],
                   ['kagent-coding', 'kagent-coding-5b79cd685-cd2aq'], ['kagent-default', 'kagent-default-5c8d7f9b4-sim1q'],
                   ['kagent-default', 'kagent-default-5c8d7f9b4-sim2q'], ['kagent-default', 'kagent-default-5c8d7f9b4-sim3q']]
    .map(([pool, name], i) => ({ name, uid: 'u' + i, pool, phase: 'Running', ready: true, sessions: 0 }));
  const actors = Array.from({ length: 54 }, (_, i) => ({
    name: `ai-sim-${i}`, uid: 's' + i, agent: i < 6 ? 'k8s-assistant-priority' : i < 10 ? 'codex-coder' : agents[i % 7 % agents.length],
    harness: i < 6 ? 'high' : i < 10 ? 'coding' : 'default',
    state: 'suspended', worker: null, since: Date.now(),
  }));
  const s = {
    context: 'simulated', connected: true, error: null, log_stream: true, now: Date.now(),
    pools: [{ namespace: 'kagent', name: 'kagent-high', desired: 2, ready: 2, priority_class: 'substrate-high', tier: 'high' },
            { namespace: 'kagent', name: 'kagent-coding', desired: 3, ready: 3, priority_class: '', tier: 'coding' },
            { namespace: 'kagent', name: 'kagent-default', desired: 3, ready: 3, priority_class: '', tier: '' }], workers, actors,
    stats: { resumes: 0, suspends: 0, creates: 0, errors: 0, p50_restore_ms: null, events_per_min: 0 },
    events: [], sessions: [], _id: 0, _lat: [],
    harness_pools: { high: 'kagent-high', coding: 'kagent-coding', default: 'kagent-default' },
  };
  const ev = (kind, agent, text) => { s.events.push({ id: ++s._id, ts: Date.now(), kind, agent, text }); s.events = s.events.slice(-40); };
  return { s, ev };
})();
// TRAFFIC in simulated mode: put one idle agent per free pool to work right away
function simBurst() {
  const { s } = simState, now = Date.now();
  const busy = new Set(s.actors.filter(a => a.worker).map(a => a.worker));
  const poolOf = a => a.agent === 'k8s-assistant-priority' ? 'kagent-high' : a.agent === 'codex-coder' ? 'kagent-coding' : 'kagent-default';
  let n = 0;
  for (const w of s.workers) {
    if (busy.has(w.name) || n >= 4) continue;
    const a = s.actors.find(x => x.state === 'suspended' && poolOf(x) === w.pool);
    if (a) { a.state = 'resuming'; a.worker = w.name; a.since = now - 200 * n; busy.add(w.name); n++; }
  }
  return n;
}
function simTick() {
  if (!sim) return;
  const { s, ev } = simState, now = Date.now();
  s.now = now;
  for (const a of s.actors) {
    if (a.state === 'resuming' && now - a.since > 260) {
      const ms = now - a.since; a.state = 'running'; a.since = now; s.stats.resumes++;
      s.sessions.push({ actor: a.name, agent: a.agent, worker: a.worker, start: now - ms, end: null, restore_ms: ms, checkpoint_ms: null });
      s.sessions = s.sessions.filter(x => x.end == null || x.end > now - 15 * 60_000).slice(-400);
      s._lat.push(ms); s._lat = s._lat.slice(-30);
      s.stats.p50_restore_ms = [...s._lat].sort((x, y) => x - y)[s._lat.length >> 1];
      s.workers.find(w => w.name === a.worker).sessions++;
      ev('restore', a.agent, `restored → ${a.worker} · ${ms} ms`);
    } else if (a.state === 'running' && now - a.since > (a._dur ??= 10000 + Math.random() * 25000)) {
      delete a._dur;
      a.state = 'suspending'; a.since = now;
    } else if (a.state === 'suspending' && now - a.since > 140) {
      for (const x of s.sessions) if (x.actor === a.name && x.end == null) { x.end = now; x.checkpoint_ms = 110 + (Math.random() * 60 | 0); }
      a.state = 'suspended'; a.worker = null; a.since = now; s.stats.suspends++;
      ev('suspend', a.agent, `checkpointed to storage · ${110 + (Math.random() * 60 | 0)} ms`);
    }
  }
  const busy = new Set(s.actors.filter(a => a.worker).map(a => a.worker));
  // each tier only schedules onto its own pool
  const poolOf = a => a.agent === 'k8s-assistant-priority' ? 'kagent-high' : a.agent === 'codex-coder' ? 'kagent-coding' : 'kagent-default';
  for (const pool of ['kagent-high', 'kagent-coding', 'kagent-default']) {
    const free = s.workers.filter(w => !busy.has(w.name) && w.pool === pool);
    // ~a new chat every few seconds per pool, leaving idle gaps on the timeline
    if (!free.length || Math.random() > (pool === 'kagent-default' ? 0.05 : 0.025)) continue;
    const idle = s.actors.filter(a => a.state === 'suspended' && poolOf(a) === pool);
    const a = idle[Math.random() * idle.length | 0];
    if (a) { a.state = 'resuming'; a.worker = free[Math.random() * free.length | 0].name; a.since = now; }
  }
  render(s);
}
setInterval(simTick, 300);

// ── app window controls ────────────────────────────────────────────────
const win = TAURI && TAURI.window && TAURI.window.getCurrentWindow ? TAURI.window.getCurrentWindow() : null;
let onTop = TAURI ? store.get('top', false) : false, clickThru = false;
function apply() {
  const v = vt();
  document.body.classList.toggle('wb', v === 'wb');
  document.body.classList.toggle('rings', v === 'rings');
  document.body.classList.toggle('bars', v === 'bars');
  document.body.classList.toggle('timeline', v === 'timeline');
  document.body.classList.toggle('bold', v === 'rings' || v === 'bars' || v === 'timeline');
  document.body.classList.toggle('invaders', v === 'invaders');
  if (v === 'invaders') arcade.start();
  document.body.classList.toggle('backdrop', backdrop);
  document.body.classList.toggle('board', theme === 'wb' && backdrop);
  document.body.classList.toggle('clickthru', clickThru);
  $('bBack').classList.toggle('on', backdrop);
  $('bTheme').textContent = { invaders: 'INVADERS', timeline: 'TIMELINE', bars: 'BARS', rings: 'RINGS', wb: 'WHITEBOARD', glass: 'GLASS' }[theme];
  $('bTop').classList.toggle('on', onTop);
  $('bClick').classList.toggle('on', clickThru);
  $('bSim').classList.toggle('on', sim);
  $('bSound').classList.toggle('on', sfx.on);
  $('bLayout').textContent = layout === 'portrait' ? 'WIDE' : 'PORTRAIT';
  if (win) {
    win.setAlwaysOnTop(onTop).catch(() => {});
    win.setIgnoreCursorEvents(clickThru).catch(() => {});
  }
}
function toggle(what) {
  if (what === 'panel') { backdrop = !backdrop; store.set('board', backdrop); }
  if (what === 'top') { onTop = !onTop; store.set('top', onTop); }
  if (what === 'click') {
    clickThru = !clickThru;
    if (clickThru && !onTop) { onTop = true; }
    toast(clickThru ? 'Click-through on · Esc to get clicks back' : 'Click-through off');
  }
  if (what === 'theme') {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('hud.theme', theme); } catch {}
    // invaders has its own 16:9 stage in wide mode: resize stage (and window) if it changed
    const was = `${W}x${H}`;
    setLayout(layout);
    if (win && TAURI.window.LogicalSize && was !== `${W}x${H}`) win.setSize(new TAURI.window.LogicalSize(W, H + LH)).catch(() => {});
    toast({ invaders: 'Space Invaders', timeline: 'Timeline', bars: 'Bars', rings: 'Rings', wb: 'Whiteboard', glass: 'Glass' }[theme]);
    if (last && !sim) render(last);
  }
  if (what === 'layout') {
    setLayout(layout === 'portrait' ? 'wide' : 'portrait');
    store.set('wide', layout === 'wide');
    if (win && TAURI.window.LogicalSize) win.setSize(new TAURI.window.LogicalSize(W, H + LH)).catch(() => {});
    $('ticker').innerHTML = '';
    if (last && !sim) render(last);
  }
  if (what === 'sim') { sim = !sim; toast(sim ? 'Simulated traffic' : 'Live cluster'); if (!sim && last) render(last); }
  apply();
}
$('bLayout').onclick = () => toggle('layout');
$('bTheme').onclick = () => toggle('theme');
$('bBack').onclick = () => toggle('panel');
$('bTop').onclick = () => toggle('top');
$('bClick').onclick = () => toggle('click');
$('bSim').onclick = () => toggle('sim');
async function sendTraffic() {
  if (sim) { toast(`Simulated burst · ${simBurst()} agents`); return; }
  try {
    const n = TAURI ? await TAURI.core.invoke('send_traffic')
                    : await fetch('/traffic').then(r => r.json()).then(j => { if (j.error) throw j.error; return j.sent; });
    toast(`Traffic wave · ${n} real chats sent (@k8s @k8sp @code @forti)`);
  } catch (e) { toast(String(e)); }
}
$('bTraffic').onclick = sendTraffic;
$('bSound').onclick = () => { toast(sfx.toggle() ? 'Sound on' : 'Sound off'); apply(); };
$('bObs').onclick = async () => {
  const url = TAURI ? await TAURI.core.invoke('obs_url') : location.origin + '/';
  try { await navigator.clipboard.writeText(url); toast(`Copied ${url} — add as OBS Browser Source`); }
  catch { toast(`OBS Browser Source: ${url}`); }
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 'l') toggle('layout');
  else if (k === 'w') toggle('theme');
  else if (k === 'b') toggle('panel');
  else if (k === 'p') toggle('top');
  else if (k === 'i') toggle('click');
  else if (k === 's') toggle('sim');
  else if (k === 't') sendTraffic();
  else if (k === 'n') { toast(sfx.toggle() ? 'Sound on' : 'Sound off'); apply(); }
  else if (k === 'escape' && clickThru) toggle('click');
});
apply();
</script>
</body>
</html>
